emit:
  - "@azure-tools/typespec-autorest"
options:
  "@azure-tools/typespec-autorest":
    type-name-strategy: "name-only"
    omit-unreachable-types: true
    emitter-output-dir: "{project-root}"
    azure-resource-provider-folder: "resource-manager"
    emit-lro-options: "all"
    examples-dir: "{project-root}/examples"
    output-file: "../{version-status}/{version}/{feature}.json"
    arm-types-dir: "{project-root}/../../../../../common-types/resource-management"
    output-splitting: "legacy-feature-files"
linter:
  extends:
    - "@azure-tools/typespec-azure-rulesets/resource-manager"
  disable:
    "@azure-tools/typespec-azure-resource-manager/arm-post-operation-response-codes": "Preserve converted Network long-running POST response contracts while registering generic resources."
    "@azure-tools/typespec-azure-resource-manager/arm-resource-invalid-envelope-property": "Preserve converted Network resource envelopes while registering generic resources."
    "@azure-tools/typespec-azure-resource-manager/arm-resource-name-pattern": "Preserve converted Network resource name contracts while registering generic resources."
