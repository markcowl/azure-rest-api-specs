name: "TypeSpec Unversioned Change - Analyze Code"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled

permissions:
  contents: read
  # Only needs read access now: comment posting moved to
  # typespec-breaking-change-comment.yaml, which has its own scoped
  # pull-requests: write permission.
  pull-requests: read

jobs:
  typespec-versioning-change:
    name: "TypeSpec Unversioned Change - Analyze Code"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node and install deps
        uses: ./.github/actions/setup-node-install-deps

      - name: Get impacted TypeSpec folders
        shell: pwsh
        run: |
          $ignoreCoreFiles = -not (@('main', 'RPSaaSMaster') -contains $Env:GITHUB_BASE_REF)
          $typespecFolders, $checkedAll = & "./eng/scripts/Get-TypeSpec-Folders.ps1" `
            -BaseCommitish:"${{ github.event.pull_request.base.sha }}" `
            -HeadCommitish:"HEAD" `
            -IgnoreCoreFiles:$ignoreCoreFiles

          $typespecFolders | Set-Content -Path typespec-folders.txt

          if ($checkedAll) {
            Write-Host "Checking all TypeSpec folders because core files changed."
          }

          Write-Host "Found $($typespecFolders.Count) impacted TypeSpec folders."
          foreach ($typespecFolder in $typespecFolders) {
            Write-Host "  $typespecFolder"
          }

      - name: Check for VersioningChangeApproved label
        id: check-label
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          LABELS=$(gh pr view "${{ github.event.pull_request.number }}" --json labels --jq '.labels[].name')
          if echo "$LABELS" | grep -q "^VersioningChangeApproved"; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
            echo "Versioning change approved via label"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run TypeSpec Unversioned Change analysis
        id: typespec-versioning-change-analyze
        shell: bash
        env:
          EMIT_ANNOTATIONS: ${{ github.event.action != 'edited' || github.event.changes.base != null }}
          VERSIONING_CHANGE_APPROVED: ${{ steps.check-label.outputs.approved }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ ! -s typespec-folders.txt ]]; then
            {
              echo "## Unversioned Change Analysis"
              echo
              echo "No impacted TypeSpec folders were found."
            } > "$GITHUB_STEP_SUMMARY"
            printf '{"findings":[],"summary":{"unsuppressedErrors":0}}\n' > "versioning-change-report.json"
            exit 0
          fi

          mapfile -t spec_folders < typespec-folders.txt

          annotations_flag=()
          if [[ "$EMIT_ANNOTATIONS" == "true" ]]; then
            annotations_flag=(--github-annotations)
          fi

          has_errors=0
          # Print the phase title once, since each per-folder CLI invocation
          # below is run with --omit-title so folders read as subsections of
          # one report instead of each repeating their own "## ..." heading.
          echo "## Unversioned Change Analysis" > "versioning-change-comment.md"
          echo "" >> "versioning-change-comment.md"

          for folder in "${spec_folders[@]}"; do
            folder_md="${folder//\//_}-versioning-report.md"
            folder_json="${folder//\//_}-versioning-report.json"

            # Let the CLI check out the base revision itself, into an isolated
            # git worktree scoped via sparse-checkout to just this folder — this
            # replaces a fragile hand-rolled checkout/restore dance that left
            # the repo's index inconsistent with the working tree for the
            # remainder of the job (see eng/tools/typespec-breaking-change
            # git-checkout.ts for the shared, unit-tested implementation).
            node eng/tools/typespec-breaking-change/src/cli/cli.js "$folder" \
              --base-ref "$BASE_SHA" \
              --phase same-version \
              --report-title "Unversioned Change Analysis" \
              --omit-title \
              --json-output "$folder_json" \
              --markdown-output "$folder_md" \
              "${annotations_flag[@]}" \
              --fail-on-breaking || has_errors=1

            if [[ -f "$folder_md" ]]; then
              cat "$folder_md" >> "versioning-change-comment.md"
              echo "" >> "versioning-change-comment.md"
            fi
          done

          # Copy to step summary
          if [[ -f "versioning-change-comment.md" ]]; then
            cat "versioning-change-comment.md" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ $has_errors -eq 1 ]]; then
            echo "breakingChangeReviewLabelName=VersioningReviewRequired" >> "$GITHUB_OUTPUT"
            echo "breakingChangeReviewLabelValue=true" >> "$GITHUB_OUTPUT"
            if [[ "$VERSIONING_CHANGE_APPROVED" == "true" ]]; then
              echo "Versioning changes detected but approved via VersioningChangeApproved label"
              exit 0
            fi
            exit 1
          fi

      # The PR comment is no longer posted from here. A separate workflow
      # (typespec-breaking-change-comment.yaml), triggered by workflow_run of
      # this workflow completing, downloads this artifact (by head_sha) along
      # with the TypeSpec Breaking Change workflow's equivalent artifact, and
      # posts/updates ONE combined comment for both phases. This avoids two
      # separate bot comments per PR and keeps comment-posting decoupled from
      # this job's own success/failure.
      - name: Upload PR comment markdown artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typespec-versioning-change-comment-md
          path: versioning-change-comment.md
          if-no-files-found: ignore

      # Upload artifact for 'VersioningReviewRequired' label
      - if: |
          always() &&
          (steps.typespec-versioning-change-analyze.outputs.breakingChangeReviewLabelName != '')
        name: Upload artifact with VersioningReviewRequired status
        uses: ./.github/actions/add-empty-artifact
        with:
          name: "${{ steps.typespec-versioning-change-analyze.outputs.breakingChangeReviewLabelName }}"
          value: "${{ steps.typespec-versioning-change-analyze.outputs.breakingChangeReviewLabelValue == 'true' }}"

      - name: Upload report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: typespec-versioning-change-report
          path: versioning-change-report.json
          if-no-files-found: ignore
