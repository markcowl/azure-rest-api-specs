name: "TypeSpec Breaking Change - Analyze Code"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled

permissions:
  contents: read
  # Only needs read access now: comment posting moved to
  # typespec-breaking-change-comment.yaml, which has its own scoped
  # pull-requests: write permission.
  pull-requests: read

jobs:
  typespec-breaking-change:
    name: "TypeSpec Breaking Change - Analyze Code"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node and install deps
        uses: ./.github/actions/setup-node-install-deps

      - name: Get impacted TypeSpec folders
        shell: pwsh
        run: |
          $ignoreCoreFiles = -not (@('main', 'RPSaaSMaster') -contains $Env:GITHUB_BASE_REF)
          $typespecFolders, $checkedAll = & "./eng/scripts/Get-TypeSpec-Folders.ps1" `
            -BaseCommitish:"${{ github.event.pull_request.base.sha }}" `
            -HeadCommitish:"HEAD" `
            -IgnoreCoreFiles:$ignoreCoreFiles

          $typespecFolders | Set-Content -Path typespec-folders.txt

          if ($checkedAll) {
            Write-Host "Checking all TypeSpec folders because core files changed."
          }

          Write-Host "Found $($typespecFolders.Count) impacted TypeSpec folders."
          foreach ($typespecFolder in $typespecFolders) {
            Write-Host "  $typespecFolder"
          }

      - name: Check for BreakingChangeApproved label
        id: check-label
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          LABELS=$(gh pr view "${{ github.event.pull_request.number }}" --json labels --jq '.labels[].name')
          if echo "$LABELS" | grep -q "^BreakingChangeApproved"; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
            echo "Breaking change approved via label"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run TypeSpec breaking change analysis
        id: typespec-breaking-change-analyze
        shell: bash
        env:
          EMIT_ANNOTATIONS: ${{ github.event.action != 'edited' || github.event.changes.base != null }}
          BREAKING_CHANGE_APPROVED: ${{ steps.check-label.outputs.approved }}
        run: |
          if [[ ! -s typespec-folders.txt ]]; then
            {
              echo "## Breaking Change Analysis"
              echo
              echo "No impacted TypeSpec folders were found."
            } > "$GITHUB_STEP_SUMMARY"
            printf '{"findings":[],"summary":{"unsuppressedErrors":0}}\n' > "breaking-change-report.json"
            exit 0
          fi

          mapfile -t spec_folders < typespec-folders.txt

          annotations_flag=()
          if [[ "$EMIT_ANNOTATIONS" == "true" ]]; then
            annotations_flag=(--github-annotations)
          fi

          has_errors=0
          all_json_results=()
          # Print the phase title once, since each per-folder CLI invocation
          # below is run with --omit-title so folders read as subsections of
          # one report instead of each repeating their own "## ..." heading.
          echo "## Breaking Change Analysis" > "breaking-change-comment.md"
          echo "" >> "breaking-change-comment.md"

          for folder in "${spec_folders[@]}"; do
            folder_json="${folder//\//_}-report.json"
            folder_md="${folder//\//_}-report.md"
            node eng/tools/typespec-breaking-change/src/cli/cli.js "$folder" \
              --phase cross-version \
              --omit-title \
              --json-output "$folder_json" \
              --markdown-output "$folder_md" \
              "${annotations_flag[@]}" \
              --fail-on-breaking || has_errors=1

            if [[ -f "$folder_md" ]]; then
              cat "$folder_md" >> "breaking-change-comment.md"
              echo "" >> "breaking-change-comment.md"
            fi
            if [[ -f "$folder_json" ]]; then
              all_json_results+=("$folder_json")
            fi
          done

          # Use the last JSON report as the artifact (TODO: merge multiple)
          if [[ ${#all_json_results[@]} -gt 0 ]]; then
            cp "${all_json_results[-1]}" "breaking-change-report.json"
          fi

          # Copy to step summary
          if [[ -f "breaking-change-comment.md" ]]; then
            cat "breaking-change-comment.md" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ $has_errors -eq 1 ]]; then
            echo "breakingChangeReviewLabelName=BreakingChangeReviewRequired" >> "$GITHUB_OUTPUT"
            echo "breakingChangeReviewLabelValue=true" >> "$GITHUB_OUTPUT"
            if [[ "$BREAKING_CHANGE_APPROVED" == "true" ]]; then
              echo "Breaking changes detected but approved via BreakingChangeApproved label"
              exit 0
            fi
            exit 1
          fi

      # The PR comment is no longer posted from here. A separate workflow
      # (typespec-breaking-change-comment.yaml), triggered by workflow_run of
      # this workflow completing, downloads this artifact (by head_sha) along
      # with the TypeSpec Unversioned Change workflow's equivalent artifact,
      # and posts/updates ONE combined comment for both phases. This avoids
      # two separate bot comments per PR and keeps comment-posting decoupled
      # from this job's own success/failure.
      - name: Upload PR comment markdown artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typespec-breaking-change-comment-md
          path: breaking-change-comment.md
          if-no-files-found: ignore

      # Upload artifact for 'BreakingChangeReviewRequired' label
      - if: |
          always() &&
          (steps.typespec-breaking-change-analyze.outputs.breakingChangeReviewLabelName != '')
        name: Upload artifact with BreakingChangeReviewRequired status
        uses: ./.github/actions/add-empty-artifact
        with:
          name: "${{ steps.typespec-breaking-change-analyze.outputs.breakingChangeReviewLabelName }}"
          value: "${{ steps.typespec-breaking-change-analyze.outputs.breakingChangeReviewLabelValue == 'true' }}"

      - name: Upload report artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: typespec-breaking-change-report
          path: breaking-change-report.json
          if-no-files-found: ignore
